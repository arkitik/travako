spring:
  datasource:
    url: jdbc:mysql://localhost:3306/arkitik_travako
    username: arkitik_travako
    password: arkitik_travako
    driver-class-name: com.mysql.cj.jdbc.Driver
arkitik:
  travako:
    config:
      server-key: travako
      runner:
        key: travako-runner-1
        duplication-detection: true
        jobs-event: 10s
      misfiring:
        enabled: true
        run-interval-minutes: 1
        threshold-seconds: 120
      cleanup:
        enabled: false
        run-interval-hours: 1
        jobs-age-in-days: 1
logging:
  level:
    io:
      arkitik: trace
    Exposed: off
